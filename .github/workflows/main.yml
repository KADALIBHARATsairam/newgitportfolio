
name: Project 1 - Automated AWS Portfolio Deploymen

# Run after changes are pushed to main/master, or manually.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Only read access to repository source code is needed.
permissions:
  contents: read

# Avoid overlapping deployments to the same EC2 instance.
concurrency:
  group: portfolio-project1-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Create AWS Infrastructure and Deploy Website
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      STACK_NAME: github-actions-portfolio-project1

    steps:
      # --------------------------------------------------
      # STEP 1: Get the latest code from this repository.
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # STEP 2: Check that the website files exist.
      # --------------------------------------------------
      - name: Validate portfolio files
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html style.css script.js; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file '$file' was not found."
              echo "Place the website files in the repository root."
              exit 1
            fi
          done

          echo "All required portfolio files were found."

      # --------------------------------------------------
      # STEP 3: Connect GitHub Actions to AWS.
      # Uses your two GitHub repository secrets.
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # STEP 4: Verify AWS authentication.
      # --------------------------------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # --------------------------------------------------
      # STEP 5: Select the official Ubuntu 22.04 AMI.
      # Reuse the AMI parameter when the stack already exists.
      # --------------------------------------------------
      - name: Select Ubuntu image
        shell: bash
        run: |
          set -euo pipefail

          AMI_ID=""

          AMI_ID=$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Parameters[?ParameterKey=='AmiId'].ParameterValue | [0]" \
              --output text 2>/dev/null || true
          )

          if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "None" ]; then
            AMI_ID=$(
              aws ec2 describe-images \
                --owners 099720109477 \
                --filters \
                  "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
                  "Name=state,Values=available" \
                --query "Images | sort_by(@, &CreationDate)[-1].ImageId" \
                --output text
            )
          fi

          if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "None" ]; then
            echo "ERROR: Could not find an Ubuntu AMI."
            exit 1
          fi

          echo "AMI_ID=$AMI_ID" >> "$GITHUB_ENV"
          echo "Ubuntu image selected."

      # --------------------------------------------------
      # STEP 6: Generate the AWS infrastructure template.
      # CloudFormation will create the resources described
      # in this template.
      # --------------------------------------------------
      - name: Generate infrastructure template
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/portfolio-stack.yaml" <<'CFN'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: GitHub Actions managed Ubuntu portfolio server

          Parameters:
            AmiId:
              Type: AWS::EC2::Image::Id
              Description: Official Ubuntu 22.04 image

          Resources:
            PortfolioVPC:
              Type: AWS::EC2::VPC
              Properties:
                CidrBlock: 10.20.0.0/16
                EnableDnsSupport: true
                EnableDnsHostnames: true
                Tags:
                  - Key: Name
                    Value: gha-portfolio-vpc

            InternetGateway:
              Type: AWS::EC2::InternetGateway
              Properties:
                Tags:
                  - Key: Name
                    Value: gha-portfolio-internet-gateway

            VPCGatewayAttachment:
              Type: AWS::EC2::VPC::VPCGatewayAttachment
              Properties:
                VpcId: !Ref PortfolioVPC
                InternetGatewayId: !Ref InternetGateway

            PublicSubnet:
              Type: AWS::EC2::Subnet
              Properties:
                VpcId: !Ref PortfolioVPC
                CidrBlock: 10.20.1.0/24
                MapPublicIpOnLaunch: true
                AvailabilityZone:
                  Fn::Select:
                    - 0
                    - Fn::GetAZs: ""
                Tags:
                  - Key: Name
                    Value: gha-portfolio-public-subnet

            PublicRouteTable:
              Type: AWS::EC2::RouteTable
              Properties:
                VpcId: !Ref PortfolioVPC
                Tags:
                  - Key: Name
                    Value: gha-portfolio-route-table

            PublicRoute:
              Type: AWS::EC2::Route
              DependsOn: VPCGatewayAttachment
              Properties:
                RouteTableId: !Ref PublicRouteTable
                DestinationCidrBlock: 0.0.0.0/0
                GatewayId: !Ref InternetGateway

            SubnetRouteAssociation:
              Type: AWS::EC2::SubnetRouteTableAssociation
              Properties:
                SubnetId: !Ref PublicSubnet
                RouteTableId: !Ref PublicRouteTable

            WebSecurityGroup:
              Type: AWS::EC2::SecurityGroup
              Properties:
                GroupDescription: Public HTTP access without inbound SSH
                VpcId: !Ref PortfolioVPC
                SecurityGroupIngress:
                  - IpProtocol: tcp
                    FromPort: 80
                    ToPort: 80
                    CidrIp: 0.0.0.0/0
                SecurityGroupEgress:
                  - IpProtocol: "-1"
                    CidrIp: 0.0.0.0/0
                Tags:
                  - Key: Name
                    Value: gha-portfolio-web-sg

            EC2Role:
              Type: AWS::IAM::Role
              Properties:
                AssumeRolePolicyDocument:
                  Version: "2012-10-17"
                  Statement:
                    - Effect: Allow
                      Principal:
                        Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
                ManagedPolicyArns:
                  - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

            EC2InstanceProfile:
              Type: AWS::IAM::InstanceProfile
              Properties:
                Roles:
                  - !Ref EC2Role

            PortfolioInstance:
              Type: AWS::EC2::Instance
              DependsOn: SubnetRouteAssociation
              Properties:
                ImageId: !Ref AmiId
                InstanceType: t3.micro
                IamInstanceProfile: !Ref EC2InstanceProfile
                NetworkInterfaces:
                  - DeviceIndex: "0"
                    AssociatePublicIpAddress: true
                    SubnetId: !Ref PublicSubnet
                    GroupSet:
                      - !Ref WebSecurityGroup
                Tags:
                  - Key: Name
                    Value: gha-portfolio-ec2
                  - Key: Project
                    Value: GitHubActionsPortfolio
                UserData:
                  Fn::Base64: |
                    #!/bin/bash
                    set -euxo pipefail
                    exec > /var/log/user-data.log 2>&1

                    export DEBIAN_FRONTEND=noninteractive
                    apt-get update -y
                    apt-get install -y nginx git curl ca-certificates

                    systemctl enable --now nginx

                    # Ubuntu images normally include SSM Agent.
                    # Start it if its systemd service is present.
                    if systemctl list-unit-files | grep -q '^amazon-ssm-agent.service'; then
                      systemctl enable --now amazon-ssm-agent
                    fi

          Outputs:
            InstanceId:
              Description: New portfolio EC2 instance
              Value: !Ref PortfolioInstance

            PublicIP:
              Description: Public IPv4 address
              Value: !GetAtt PortfolioInstance.PublicIp

            WebsiteURL:
              Description: Public HTTP website address
              Value: !Sub "http://${PortfolioInstance.PublicIp}"
          CFN

      # --------------------------------------------------
      # STEP 7: Create or update the AWS infrastructure.
      # First run creates it; future runs reuse this stack.
      # --------------------------------------------------
      - name: Create AWS infrastructure
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file "$RUNNER_TEMP/portfolio-stack.yaml" \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "AmiId=$AMI_ID" \
            --no-fail-on-empty-changeset \
            --tags Project=GitHubActionsPortfolio Environment=Learning

      # --------------------------------------------------
      # STEP 8: Read the instance ID and public URL.
      # --------------------------------------------------
      - name: Get deployment outputs
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID=$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue | [0]" \
              --output text
          )

          WEBSITE_URL=$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue | [0]" \
              --output text
          )

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: The EC2 instance ID was not found."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "WEBSITE_URL=$WEBSITE_URL" >> "$GITHUB_ENV"

          echo "EC2 instance: $INSTANCE_ID"
          echo "Website URL: $WEBSITE_URL"
          echo "Website URL: $WEBSITE_URL" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # STEP 9: Wait until the instance is online in SSM.
      # SSM lets us run commands without SSH or a PEM key.
      # --------------------------------------------------
      - name: Wait for Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            STATUS=$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || true
            )

            if [ "$STATUS" = "Online" ]; then
              echo "EC2 is online in Systems Manager."
              exit 0
            fi

            echo "Waiting for EC2/SSM: attempt $attempt of 60"
            sleep 10
          done

          echo "ERROR: EC2 did not become online in Systems Manager."
          echo "Check the CloudFormation stack and EC2 user-data logs."
          exit 1

      # --------------------------------------------------
      # STEP 10: Prepare the script that runs ON EC2.
      # Important: Package installation happens in this
      # script, not on the GitHub Actions runner.
      # --------------------------------------------------
      - name: Prepare EC2 deployment script
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/deploy-portfolio.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          # Wait for the initial Ubuntu setup to finish.
          cloud-init status --wait || true

          # Install Nginx and Git on the actual EC2 instance.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y nginx git curl ca-certificates

          systemctl enable --now nginx

          # GitHub repository and branch are filled by the runner.
          REPO_URL="REPLACE_REPO_URL"
          BRANCH="REPLACE_BRANCH"

          SOURCE_DIR="/opt/portfolio-source"
          WEB_ROOT="/var/www/html"

          # Clone the repository on the first run.
          # On later runs, fetch the latest branch changes.
          if [ -d "$SOURCE_DIR/.git" ]; then
            git -C "$SOURCE_DIR" remote set-url origin "$REPO_URL"
            git -C "$SOURCE_DIR" fetch --depth 1 origin "$BRANCH"
            git -C "$SOURCE_DIR" checkout -B "$BRANCH" FETCH_HEAD
            git -C "$SOURCE_DIR" reset --hard FETCH_HEAD
          else
            rm -rf "$SOURCE_DIR"
            git clone --depth 1 --branch "$BRANCH" \
              "$REPO_URL" "$SOURCE_DIR"
          fi

          # Validate the main site files before publishing.
          for file in index.html style.css script.js; do
            if [ ! -f "$SOURCE_DIR/$file" ]; then
              echo "ERROR: Required file $file is missing from the repository."
              exit 1
            fi
          done

          # Copy the repository website files to Nginx's web root.
          mkdir -p "$WEB_ROOT"
          find "$WEB_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$SOURCE_DIR/." "$WEB_ROOT/"

          # Do not publish Git metadata or workflow files.
          rm -rf "$WEB_ROOT/.git" "$WEB_ROOT/.github"

          chown -R www-data:www-data "$WEB_ROOT"

          # Validate and restart the web server.
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx

          # Check the site locally on EC2.
          curl -fsS http://127.0.0.1/ -o /dev/null

          echo "SUCCESS: Repository checked out and website deployed."
          SCRIPT

          # Insert the repository and branch into the remote script.
          sed -i \
            "s|REPLACE_REPO_URL|https://github.com/${GITHUB_REPOSITORY}.git|g" \
            "$RUNNER_TEMP/deploy-portfolio.sh"

          sed -i \
            "s|REPLACE_BRANCH|${GITHUB_REF_NAME}|g" \
            "$RUNNER_TEMP/deploy-portfolio.sh"

      # --------------------------------------------------
      # STEP 11: Send the deployment script to EC2 using SSM.
      # SSM runs the command on the remote Ubuntu instance.
      # --------------------------------------------------
      - name: Deploy repository to Nginx
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_B64=$(base64 -w 0 "$RUNNER_TEMP/deploy-portfolio.sh")

          PARAMETERS=$(
            jq -cn \
              --arg command "echo '$DEPLOY_B64' | base64 -d | bash" \
              '{commands: [$command]}'
          )

          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy portfolio from GitHub Actions" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM command submitted: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 120); do
            STATUS=$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              break
            fi

            case "$STATUS" in
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                echo "Remote deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true

                exit 1
                ;;
            esac

            echo "Remote deployment status: $STATUS"
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: Timed out waiting for the remote deployment."
            exit 1
          fi

      # --------------------------------------------------
      # STEP 12: Test the public website from GitHub Actions.
      # --------------------------------------------------
      - name: Verify live website
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl -fsS "$WEBSITE_URL/" -o /dev/null; then
              echo "SUCCESS: Website is live at $WEBSITE_URL"
              exit 0
            fi

            echo "Waiting for the website: attempt $attempt of 12"
            sleep 5
          done

          echo "ERROR: The website did not respond over HTTP."
          exit 1
